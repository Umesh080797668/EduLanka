# ─────────────────────────────────────────────────────────────────────────────
# EduLanka — Docker Compose (Local Development Stack)
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cd infrastructure/docker
#   docker compose up --build -d
#
# Services:
#   edu-redis          → Redis for sessions & queues    (port 6379)
#   edu-nginx          → API gateway / reverse proxy    (port 8081)
#   edu-api            → NestJS REST API                (port 3001, internal)
#   edu-web            → Next.js web dashboard          (port 3000, internal)
#
# NOTE: No local Postgres — the API connects directly to Supabase cloud.
#       Set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in apps/api/.env
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Redis ─────────────────────────────────────────────────────────────────
  edu-redis:
    image: redis:7-alpine
    container_name: edu-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - edu-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edu-network

  # ── NestJS REST API ───────────────────────────────────────────────────────
  edu-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: edu-api
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      REDIS_HOST: edu-redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001" # Exposed directly for local dev; in prod only Nginx sees this
    depends_on:
      edu-redis:
        condition: service_healthy
    networks:
      - edu-network

  # ── Next.js Web Dashboard ──────────────────────────────────────────────────
  edu-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: edu-web
    restart: unless-stopped
    env_file:
      - ../../apps/web/.env.local
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
    ports:
      - "3000:3000" # Exposed directly for local dev
    depends_on:
      - edu-api
    networks:
      - edu-network

  # ── Nginx API Gateway ─────────────────────────────────────────────────────
  # Port 8081 — port 80 conflicts with Tomcat on the host machine.
  edu-nginx:
    image: nginx:1.27-alpine
    container_name: edu-nginx
    restart: unless-stopped
    ports:
      - "8081:80" # Host:8081 → Container:80
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - edu-api
      - edu-web
    networks:
      - edu-network

# ── Persistent volumes ─────────────────────────────────────────────────────
volumes:
  edu-redis-data:

    # ── Shared bridge network ──────────────────────────────────────────────────
networks:
  edu-network:
    driver: bridge
