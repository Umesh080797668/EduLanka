# ─────────────────────────────────────────────────────────────────────────────
# EduLanka — edu-lanka.conf
# Virtual host: API gateway + rate limiting + upstream proxy rules
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream definitions ───────────────────────────────────────────────────
upstream edu_api_upstream {
  server edu-api:3001;
  keepalive 32;
}

upstream edu_web_upstream {
  server edu-web:3000;
  keepalive 32;
}

# ── HTTP server ────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  client_max_body_size 10M;

  # ── Health check (no rate limit — used by container orchestrators) ────────
  location = /api/v1/health {
    proxy_pass         http://edu_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    access_log off;
  }

  # ── Auth endpoints — tightest rate limit (5 req/min per IP) ─────────────
  location ~ ^/api/v[0-9]+/auth/ {
    limit_req zone=api_auth burst=3 nodelay;

    proxy_pass         http://edu_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Security: strip internal headers before forwarding
    proxy_set_header   X-Tenant-Id $http_x_tenant_id;
  }

  # ── All other API routes — general rate limit (30 req/min per IP) ────────
  location ~ ^/api/ {
    limit_req zone=api_general burst=10 nodelay;

    proxy_pass         http://edu_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Tenant-Id $http_x_tenant_id;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
  }

  # ── Next.js web app — all remaining traffic ───────────────────────────────
  location / {
    proxy_pass         http://edu_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
