# ─────────────────────────────────────────────────────────────────────────────
# EduLanka Nginx — Main configuration
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time';

  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript application/json
    application/javascript application/x-javascript
    text/xml application/xml application/xml+rss image/svg+xml;

  # ── Security headers (global) ─────────────────────────────────────────────
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # Zone shared across all Nginx workers via shared memory
  # 10m → ~160,000 unique IPs can be tracked
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
  limit_req_status 429;

  # ── Include virtual host configs ───────────────────────────────────────────
  include /etc/nginx/conf.d/*.conf;
}
