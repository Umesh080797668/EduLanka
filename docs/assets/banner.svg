<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="EduLanka — one platform for every school in Sri Lanka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#0E4A5C"/>
      <stop offset="1" stop-color="#127C74"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#3FE0C5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FE0C5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>

  <!-- abstract open-book + signal mark -->
  <g transform="translate(96 92)">
    <rect width="96" height="96" rx="24" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <path d="M48 70 V34 M48 34 C40 28 26 27 18 30 V64 C26 61 40 62 48 68 C56 62 70 61 78 64 V30 C70 27 56 28 48 34 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#3FE0C5" stroke-linecap="round" stroke-opacity="0.55" transform="translate(1090 70)">
    <path d="M0 60 A60 60 0 0 1 60 0" stroke-width="5"/>
    <path d="M0 96 A96 96 0 0 1 96 0" stroke-width="5" stroke-opacity="0.4"/>
    <path d="M0 132 A132 132 0 0 1 132 0" stroke-width="5" stroke-opacity="0.25"/>
    <circle cx="6" cy="6" r="7" fill="#3FE0C5" stroke="none"/>
  </g>

  <text x="220" y="148" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Edu<tspan fill="url(#accent)">Lanka</tspan></text>
  <text x="222" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#D9F3EE">One platform for every school in Sri Lanka</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1F3A">
    <rect x="222" y="232" rx="17" width="150" height="34" fill="#FFB547"/><text x="297" y="255" text-anchor="middle">Grades 1–13</text>
    <rect x="386" y="232" rx="17" width="168" height="34" fill="#FFFFFF" fill-opacity="0.92"/><text x="470" y="255" text-anchor="middle">Offline-first app</text>
    <rect x="568" y="232" rx="17" width="236" height="34" fill="#FFFFFF" fill-opacity="0.92"/><text x="686" y="255" text-anchor="middle">Sinhala · Tamil · English</text>
    <rect x="818" y="232" rx="17" width="156" height="34" fill="#FFFFFF" fill-opacity="0.92"/><text x="896" y="255" text-anchor="middle">Multi-tenant</text>
  </g>
</svg>
