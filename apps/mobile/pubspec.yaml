name: edulanka_mobile
description: "EduLanka — Phase 3 Offline-First Mobile Application"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: any
  sqflite: ^2.4.2+1
  sqflite_sqlcipher: ^3.4.1
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqflite_common_ffi: ^2.4.0+3
  drift: ^2.35.2
  connectivity_plus: ^7.3.2
  web_socket_channel: ^3.0.3
  video_player: ^2.11.1
  sentry_flutter: ^9.3.0
  syncfusion_flutter_core: ^33.2.13
  syncfusion_flutter_pdfviewer: ^33.2.13
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/tutorials/
    - assets/fonts/

  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc


