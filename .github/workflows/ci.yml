name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test:cov

      - name: Start Throwaway Database & Seed
        run: |
          if command -v docker &> /dev/null; then
            echo "Starting local Supabase throwaway database..."
            npx --yes supabase start || true
            if [ -f supabase/seed.sql ]; then
              DB_CONTAINER=$(docker ps -q --filter "name=supabase_db" | head -n 1)
              if [ -n "$DB_CONTAINER" ]; then
                echo "Seeding database from supabase/seed.sql..."
                docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres < supabase/seed.sql || true
              fi
            fi
          else
            echo "Docker not available; tests with live database dependency will skip gracefully."
          fi

      - name: Test E2E
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4Nzk2MDB9.CRX1ElSmPrCu-COlhkh1AnlPr_bfqvgtpmecTeA_X_8
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4Mzg3OTYwMH0.EG-vlsmLh4-WRp_rEQj8m2UktW_2n19-qZ-d1s2s9yM
          NODE_ENV: test
        run: pnpm turbo run test:e2e

      - name: Teardown Throwaway Database
        if: always()
        run: |
          npx --yes supabase stop || true

      - name: Build
        run: pnpm turbo run build

      - name: Boot API & Verify Health Check
        run: |
          cd apps/api
          API_PORT=8081
          PORT=$API_PORT node dist/main.js &
          API_PID=$!

          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/api/v1/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "API booted successfully and /api/v1/health responded with HTTP 200 OK!"
              SUCCESS=1
              break
            fi
            sleep 1
          done

          kill $API_PID || true
          if [ $SUCCESS -ne 1 ]; then
            echo "API boot health check failed or timed out"
            exit 1
          fi
