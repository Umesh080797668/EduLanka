name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Start Throwaway Database
        run: |
          echo "Starting local Supabase throwaway database..."
          npx --yes supabase start

          echo "Extracting runtime credentials from started Supabase instance..."
          STATUS_JSON=$(npx --yes supabase status -o json)
          node -e "
            const fs = require('fs');
            const data = JSON.parse(process.argv[1]);
            const envFile = process.env.GITHUB_ENV;
            if (envFile) {
              fs.appendFileSync(envFile, \`SUPABASE_URL=\${data.API_URL || 'http://127.0.0.1:54321'}\n\`);
              fs.appendFileSync(envFile, \`SUPABASE_ANON_KEY=\${data.ANON_KEY}\n\`);
              fs.appendFileSync(envFile, \`SUPABASE_SERVICE_ROLE_KEY=\${data.SERVICE_ROLE_KEY}\n\`);
            }
          " "$STATUS_JSON"

          echo "Verifying database health check on REST endpoint..."
          STATUS=0
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:54321/rest/v1/" || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "Database is healthy and reachable at http://127.0.0.1:54321"
              STATUS=1
              break
            fi
            sleep 1
          done
          if [ $STATUS -ne 1 ]; then
            echo "Database health check failed: http://127.0.0.1:54321/rest/v1/ did not respond"
            exit 1
          fi

      - name: Test
        env:
          NODE_ENV: test
          CI: "true"
        run: pnpm turbo run test:cov

      - name: Test E2E
        env:
          NODE_ENV: test
          CI: "true"
        run: pnpm turbo run test:e2e

      - name: Teardown Throwaway Database
        if: always()
        run: |
          npx --yes supabase stop

      - name: Build
        run: pnpm turbo run build

      - name: Boot API & Verify Health Check
        run: |
          cd apps/api
          API_PORT=8081
          PORT=$API_PORT node dist/main.js &
          API_PID=$!

          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/api/v1/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "API booted successfully and /api/v1/health responded with HTTP 200 OK!"
              SUCCESS=1
              break
            fi
            sleep 1
          done

          kill $API_PID || true
          if [ $SUCCESS -ne 1 ]; then
            echo "API boot health check failed or timed out"
            exit 1
          fi

  flutter-mobile:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Test
        run: |
          cd apps/mobile
          flutter test --concurrency=1

      - name: Build Android APK
        run: |
          cd apps/mobile
          flutter build apk --debug

